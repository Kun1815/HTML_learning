<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>

  <h1>song and video</h1>

  <section>

    <h2>The song that is currently playing</h2>

    <audio controls aria-label="something about audio"><source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio"></audio>

  </section>
  <section>

    <h2>The video that is currently playing</h2>

    <video controls width="300" aria-label>
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video">

      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="video" srclang="eng" label="subtitle">
      </track>
    </video>

  </section>
  <section>
    <h2>Transcript</h2>
    <p>something about transcript</p>


  </section>      






</body>

</html>
