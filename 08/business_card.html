<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="business-card">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" class="profile-image" alt="a red flower">

        <p class="full-name">MuDan Flower</p>
        <p class="designation">very red and beautiful</p>
        <p class="company">SanQuan</p>
        <hr>
        <p>123@123.com</p>
        <p>12345678</p>
        <a class="portfolio-link" href="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg">Twitter</a>
            <a href="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg">LinkedIn</a>
            <a href="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg">GitHub</a>
        </div>    
    </div>    



</body>

</html>
